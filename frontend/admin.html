<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPE BOX — Админ-панель</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f14;
        color: #e8e8ee;
        padding: 16px;
        min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 16px; color: #8b5cf6; }
    .login {
        max-width: 400px;
        margin: 80px auto;
        padding: 24px;
        background: #1a1a24;
        border-radius: 16px;
    }
    .login h2 { font-size: 18px; margin-bottom: 16px; }
    .login input {
        width: 100%;
        padding: 12px 14px;
        background: #0f0f14;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #e8e8ee;
        font-size: 16px;
        margin-bottom: 12px;
    }
    .login button {
        width: 100%;
        padding: 12px;
        background: #8b5cf6;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }
    .hidden { display: none !important; }
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 8px;
        flex-wrap: wrap;
    }
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
    }
    .tab-btn {
        padding: 10px 16px;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #b0b0c0;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
    }
    .tab-btn.active {
        background: #8b5cf6;
        color: #fff;
        border-color: #8b5cf6;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-btn {
        padding: 8px 14px;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #b0b0c0;
        cursor: pointer;
        font-size: 14px;
    }
    .filter-btn.active { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
    .mode-filter-btn {
        padding: 8px 14px;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #b0b0c0;
        cursor: pointer;
        font-size: 14px;
    }
    .mode-filter-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .search {
        width: 100%;
        padding: 10px 14px;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #e8e8ee;
        font-size: 14px;
        margin-bottom: 16px;
    }
    .orders { display: flex; flex-direction: column; gap: 12px; }
    .order {
        background: #1a1a24;
        border-radius: 14px;
        padding: 16px;
        border-left: 4px solid #8b5cf6;
    }
    .order.status-Новый { border-left-color: #f59e0b; }
    .order.status-Принят { border-left-color: #3b82f6; }
    .order.status-Отправлен { border-left-color: #8b5cf6; }
    .order.status-Завершён { border-left-color: #10b981; }
    .order.status-Отменён { border-left-color: #ef4444; opacity: 0.6; }
    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        gap: 8px;
        flex-wrap: wrap;
    }
    .order-number { font-weight: 700; font-size: 16px; color: #8b5cf6; }
    .order-date { font-size: 12px; color: #8080a0; }
    .order-status {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        background: #2a2a38;
    }
    .order-mode-badge {
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        margin-left: 6px;
        vertical-align: middle;
    }
    .order-mode-badge.opt { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .order-mode-badge.retail { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .order-info { font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
    .order-info b { color: #b0b0c0; font-weight: 500; }
    .order-items {
        background: #0f0f14;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 10px;
        white-space: pre-wrap;
    }
    .order-total { font-size: 16px; font-weight: 700; color: #8b5cf6; margin-bottom: 12px; }
    .order-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .order-actions button {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
    }
    .btn-accept { background: #3b82f6; }
    .btn-sent { background: #8b5cf6; }
    .btn-done { background: #10b981; }
    .btn-cancel { background: #ef4444; }
    .btn-delete { background: #2a2a38; color: #8080a0 !important; }
    .empty { text-align: center; padding: 60px 20px; color: #8080a0; }
    .refresh-info { font-size: 12px; color: #8080a0; text-align: center; margin-top: 20px; }
    .logout-btn {
        padding: 8px 14px;
        background: #2a2a38;
        color: #b0b0c0;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
    }
    /* Картинки */
    .img-upload-block {
        background: #1a1a24;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
    }
    .img-upload-block h3 { font-size: 16px; margin-bottom: 12px; color: #8b5cf6; }
    .img-upload-block label {
        display: block;
        font-size: 13px;
        color: #b0b0c0;
        margin-bottom: 6px;
        margin-top: 12px;
    }
    .img-upload-block select, .img-upload-block input[type="text"] {
        width: 100%;
        padding: 10px 14px;
        background: #0f0f14;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        color: #e8e8ee;
        font-size: 14px;
    }
    .img-upload-block input[type="file"] {
        width: 100%;
        padding: 10px;
        background: #0f0f14;
        border: 1px dashed #2a2a38;
        border-radius: 10px;
        color: #b0b0c0;
        font-size: 13px;
    }
    .img-upload-btn {
        width: 100%;
        padding: 14px;
        background: #8b5cf6;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 16px;
    }
    .img-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .img-card {
        background: #1a1a24;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
    }
    .img-card img {
        width: 100%;
        height: 120px;
        object-fit: contain;
        border-radius: 8px;
        margin-bottom: 8px;
        background: #0f0f14;
    }
    .img-card .img-cat {
        font-size: 12px;
        color: #b0b0c0;
        margin-bottom: 6px;
        word-break: break-all;
    }
    .img-card .img-del {
        width: 100%;
        padding: 6px;
        background: #ef4444;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="loginScreen" class="login">
    <h2>🔒 Админ-панель VAPE BOX</h2>
    <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="off">
    <button onclick="tryLogin()">Войти</button>
    <p id="loginError" style="color:#ef4444;font-size:13px;margin-top:10px;min-height:18px;"></p>
</div>

<div id="adminPanel" class="hidden">
    <div class="header">
        <h1>📦 VAPE BOX — Админ</h1>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="orders" onclick="setTab('orders')">📦 Заказы</button>
        <button class="tab-btn" data-tab="images" onclick="setTab('images')">🖼️ Картинки</button>
    </div>

    <!-- Вкладка ЗАКАЗЫ -->
    <div class="tab-content active" id="tab-orders">
        <div class="filters">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Все</button>
            <button class="filter-btn" data-filter="Новый" onclick="setFilter('Новый')">🟡 Новые</button>
            <button class="filter-btn" data-filter="Принят" onclick="setFilter('Принят')">🔵 Принят</button>
            <button class="filter-btn" data-filter="Отправлен" onclick="setFilter('Отправлен')">🟣 Отправлен</button>
            <button class="filter-btn" data-filter="Завершён" onclick="setFilter('Завершён')">🟢 Завершён</button>
            <button class="filter-btn" data-filter="Отменён" onclick="setFilter('Отменён')">🔴 Отменён</button>
        </div>

        <div class="filters" style="margin-top:-8px;">
            <button class="mode-filter-btn active" data-mode="all" onclick="setModeFilter('all')">🌐 Все режимы</button>
            <button class="mode-filter-btn" data-mode="opt" onclick="setModeFilter('opt')">📦 Опт</button>
            <button class="mode-filter-btn" data-mode="retail" onclick="setModeFilter('retail')">🛒 Розница</button>
        </div>

        <input type="text" class="search" id="searchInput" placeholder="Поиск по номеру, имени, телефону..." oninput="renderOrders()">

        <div class="orders" id="ordersContainer"></div>

        <div class="refresh-info">
            Автообновление каждые 30 сек • <span id="lastUpdate"></span>
        </div>
    </div>

    <!-- Вкладка КАРТИНКИ -->
    <div class="tab-content" id="tab-images">
        <div class="img-upload-block">
            <h3>📤 Загрузить картинку</h3>

            <label>Категория</label>
            <select id="imgCategory">
                <option value="Жидкости">🍓 Жидкости</option>
                <option value="Одноразки">⚡ Одноразки</option>
                <option value="Под-системы">📱 Под-системы</option>
                <option value="Расходники">🧰 Расходники</option>
                <option value="Шайбы">🎮 Шайбы</option>
                <option value="Никотиновые ватки">💊 Никотиновые ватки</option>
                <option value="БЛОЧНО">📦 БЛОЧНО</option>
            </select>

            <label>Картинка (PNG / JPG, до 500 КБ)</label>
            <input type="file" id="imgFile" accept="image/*">

            <button class="img-upload-btn" onclick="uploadImage()">📤 Загрузить на сервер</button>
        </div>

        <h3 style="font-size:16px;margin-bottom:12px;color:#8b5cf6;">🖼️ Загруженные картинки</h3>
        <div class="img-list" id="imgList"></div>
    </div>
</div>

<script>
const API_URL = "https://vape-box.onrender.com";
const ADMIN_PASSWORD = "TV12131415";

let allOrders = [];
let currentFilter = 'all';
let currentModeFilter = 'all';
let refreshInterval = null;

// ===== ВХОД =====
function tryLogin() {
    const input = document.getElementById('passwordInput').value;
    if (input === ADMIN_PASSWORD) {
        localStorage.setItem('vapebox_admin', '1');
        showPanel();
    } else {
        document.getElementById('loginError').textContent = '❌ Неверный пароль';
    }
}

function logout() {
    localStorage.removeItem('vapebox_admin');
    if (refreshInterval) clearInterval(refreshInterval);
    document.getElementById('adminPanel').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
}

function showPanel() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadOrders();
    loadImages();
    refreshInterval = setInterval(loadOrders, 30000);
}

// ===== ВКЛАДКИ =====
function setTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => {
        c.classList.toggle('active', c.id === 'tab-' + tab);
    });
    if (tab === 'images') loadImages();
}

// ===== ЗАКАЗЫ =====
async function loadOrders() {
    try {
        const resp = await fetch(`${API_URL}/api/orders`);
        const data = await resp.json();
        allOrders = data.orders || [];
        renderOrders();
        document.getElementById('lastUpdate').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU');
    } catch (err) {
        console.error('Ошибка загрузки:', err);
    }
}

function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
    });
    renderOrders();
}

function setModeFilter(mode) {
    currentModeFilter = mode;
    document.querySelectorAll('.mode-filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
    });
    renderOrders();
}

function renderOrders() {
    const container = document.getElementById('ordersContainer');
    const search = document.getElementById('searchInput').value.toLowerCase().trim();

    let filtered = allOrders;
    if (currentFilter !== 'all') {
        filtered = filtered.filter(o => o.status === currentFilter);
    }
    if (currentModeFilter !== 'all') {
        filtered = filtered.filter(o => (o.mode || 'opt') === currentModeFilter);
    }
    if (search) {
        filtered = filtered.filter(o =>
            (o.order_number || '').toLowerCase().includes(search) ||
            (o.customer_name || '').toLowerCase().includes(search) ||
            (o.customer_phone || '').toLowerCase().includes(search) ||
            (o.customer_telegram || '').toLowerCase().includes(search)
        );
    }

    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">📭 Заказов нет</div>';
        return;
    }

    container.innerHTML = '';
    filtered.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order status-' + (order.status || 'Новый');

        const itemsText = (order.items || []).map(i =>
            `• ${i.name} × ${i.quantity} = ${i.total}₽`
        ).join('\n');

        const date = order.created_at ? new Date(order.created_at).toLocaleString('ru-RU') : '—';
        const isRetail = order.mode === 'retail';

        div.innerHTML = `
            <div class="order-header">
                <span class="order-number">
                    № ${order.order_number}
                    <span class="order-mode-badge ${isRetail ? 'retail' : 'opt'}">
                        ${isRetail ? '🛒 РОЗНИЦА' : '📦 ОПТ'}
                    </span>
                </span>
                <span class="order-status">${order.status || 'Новый'}</span>
            </div>
            <div class="order-date">${date}</div>
            <div class="order-info" style="margin-top:10px;">
                <b>Клиент:</b> ${order.customer_name || '—'}<br>
                ${order.customer_telegram ? `<b>TG:</b> ${order.customer_telegram}<br>` : ''}
                ${order.customer_phone ? `<b>Тел:</b> ${order.customer_phone}<br>` : ''}
                ${order.customer_address ? `<b>Адрес:</b> ${order.customer_address}<br>` : ''}
                ${order.comment ? `<b>Коммент:</b> ${order.comment}` : ''}
            </div>
            <div class="order-items">${itemsText || 'Нет товаров'}</div>
            <div class="order-total">💰 ${order.total}₽</div>
            <div class="order-actions">
                <button class="btn-accept" onclick="setStatus('${order.order_number}', 'Принят')">✅ Принять</button>
                <button class="btn-sent" onclick="setStatus('${order.order_number}', 'Отправлен')">🚚 Отправлен</button>
                <button class="btn-done" onclick="setStatus('${order.order_number}', 'Завершён')">🏁 Завершён</button>
                <button class="btn-cancel" onclick="setStatus('${order.order_number}', 'Отменён')">❌ Отменить</button>
                <button class="btn-delete" onclick="deleteOrder('${order.order_number}')">🗑️ Удалить</button>
            </div>
        `;
        container.appendChild(div);
    });
}

async function setStatus(orderNumber, status) {
    try {
        const resp = await fetch(`${API_URL}/api/orders/${orderNumber}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        const data = await resp.json();
        if (data.success) { loadOrders(); }
        else { alert('Ошибка: ' + (data.error || 'не удалось')); }
    } catch (err) { alert('Ошибка сети: ' + err.message); }
}

async function deleteOrder(orderNumber) {
    if (!confirm('Удалить заказ ' + orderNumber + '?')) return;
    try {
        const resp = await fetch(`${API_URL}/api/orders/${orderNumber}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.success) { loadOrders(); }
        else { alert('Ошибка: ' + (data.error || 'не удалось')); }
    } catch (err) { alert('Ошибка сети: ' + err.message); }
}

// ===== КАРТИНКИ =====
async function uploadImage() {
    const fileInput = document.getElementById('imgFile');
    const category = document.getElementById('imgCategory').value;

    if (!fileInput.files || fileInput.files.length === 0) {
        alert('Выберите картинку');
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('file', file);

    try {
        const resp = await fetch(`${API_URL}/api/upload-image?category=${encodeURIComponent(category)}`, {
            method: 'POST',
            body: formData
        });
        const data = await resp.json();
        if (data.success) {
            alert('✅ Картинка загружена!');
            fileInput.value = '';
            loadImages();
        } else {
            alert('❌ Ошибка: ' + (data.error || 'не удалось'));
        }
    } catch (err) {
        alert('Ошибка сети: ' + err.message);
    }
}

async function loadImages() {
    try {
        const resp = await fetch(`${API_URL}/api/images`);
        const data = await resp.json();
        const images = data.images || [];
        const container = document.getElementById('imgList');

        if (images.length === 0) {
            container.innerHTML = '<div class="empty" style="grid-column:1/-1;">🖼️ Картинок пока нет</div>';
            return;
        }

        container.innerHTML = '';
        images.forEach(img => {
            const card = document.createElement('div');
            card.className = 'img-card';
            card.innerHTML = `
                <img src="${img.image_url}" alt="${img.category}">
                <div class="img-cat">${img.category}</div>
                <button class="img-del" onclick="deleteImage(${img.id})">🗑️ Удалить</button>
            `;
            container.appendChild(card);
        });
    } catch (err) {
        console.error('Ошибка загрузки картинок:', err);
    }
}

async function deleteImage(id) {
    if (!confirm('Удалить картинку?')) return;
    try {
        const resp = await fetch(`${API_URL}/api/images/${id}`, { method: 'DELETE' });
        const data = await resp.json();
        if (data.success) { loadImages(); }
        else { alert('Ошибка: ' + (data.error || 'не удалось')); }
    } catch (err) { alert('Ошибка сети: ' + err.message); }
}

// ===== СТАРТ =====
if (localStorage.getItem('vapebox_admin') === '1') { showPanel(); }

document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
});
</script>

</body>
</html>
