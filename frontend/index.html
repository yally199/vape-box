<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>VAPE BOX</title>
    
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <!-- Шапка -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                VAPE BOX
            </div>
            <div class="header-actions">
                <button class="cart-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
        <p class="header-subtitle">Магазин вейп-товаров</p>
    </header>

    <!-- Поиск -->
    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input 
            class="search-input" 
            id="searchInput"
            type="text" 
            placeholder="Поиск товара..."
        >
        <button class="search-clear" id="searchClear" style="display: none;">
            <i class="fas fa-times-circle"></i>
        </button>
    </div>

    <!-- Категории -->
    <div class="categories-wrapper">
        <div class="categories" id="categoriesContainer">
            <button class="category active" data-category="all">
                <i class="fas fa-th-large"></i>
                Все
            </button>
            <button class="category" data-category="liquid">
                <i class="fas fa-flask"></i>
                Жидкости
            </button>
            <button class="category" data-category="disposable">
                <i class="fas fa-sync-alt"></i>
                Одноразки
            </button>
            <button class="category" data-category="pods">
                <i class="fas fa-microchip"></i>
                Под-системы
            </button>
            <button class="category" data-category="consumables">
                <i class="fas fa-cogs"></i>
                Расходники
            </button>
            <button class="category" data-category="pouches">
                <i class="fas fa-box"></i>
                Шайбы/Пэки
            </button>
            <button class="category" data-category="nicotine">
                <i class="fas fa-bolt"></i>
                Никотиновые
            </button>
        </div>
    </div>

    <!-- Основной контент -->
    <main class="main">
        <div class="products" id="productsContainer">
            <!-- Товары подгружаются из JS -->
        </div>
        
        <!-- Состояние "Ничего не найдено" -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-search"></i>
            <h3>Товаров не найдено</h3>
            <p>Попробуйте изменить поиск или категорию</p>
        </div>
    </main>

    <!-- Модальное окно корзины -->
    <div class="modal" id="cartModal">
        <div class="modal-overlay" id="modalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-shopping-cart"></i> Корзина</h2>
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="cartItems">
                    <!-- Товары в корзине -->
                </div>
                <div id="cartEmpty" style="display: none;">
                    <div class="empty-cart">
                        <i class="fas fa-shopping-basket"></i>
                        <p>Корзина пуста</p>
                        <p class="empty-sub">Добавьте товары из каталога</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer" id="cartFooter" style="display: none;">
                <div class="cart-total">
                    <span>Итого:</span>
                    <span class="total-price" id="cartTotalPrice">0 ₽</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">
                    <i class="fas fa-credit-card"></i>
                    Оформить заказ
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно оформления заказа -->
    <div class="modal" id="orderModal">
        <div class="modal-overlay" id="orderModalOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-clipboard-list"></i> Оформление заказа</h2>
                <button class="modal-close" id="orderModalClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="orderForm">
                    <div class="form-group">
                        <label for="customerName">Ваше имя</label>
                        <input 
                            type="text" 
                            id="customerName" 
                            placeholder="Введите ваше имя"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Телефон</label>
                        <input 
                            type="tel" 
                            id="customerPhone" 
                            placeholder="+7 (999) 123-45-67"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="customerAddress">Адрес доставки</label>
                        <input 
                            type="text" 
                            id="customerAddress" 
                            placeholder="Введите адрес доставки"
                        >
                    </div>
                    <div class="form-group">
                        <label for="orderComment">Комментарий к заказу</label>
                        <textarea 
                            id="orderComment" 
                            rows="2" 
                            placeholder="Дополнительная информация..."
                        ></textarea>
                    </div>
                    <div class="order-summary">
                        <div class="order-items-list" id="orderItemsList">
                            <!-- Товары в заказе -->
                        </div>
                        <div class="order-total">
                            <span>Итого к оплате:</span>
                            <span id="orderTotalPrice">0 ₽</span>
                        </div>
                    </div>
                    <button type="submit" class="submit-order-btn">
                        <i class="fas fa-check"></i>
                        Подтвердить заказ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Модальное окно успешного заказа -->
    <div class="modal" id="successModal">
        <div class="modal-overlay" id="successModalOverlay"></div>
        <div class="modal-content success-content">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Заказ оформлен!</h2>
            <p class="order-number" id="orderNumber">№ VB-1001</p>
            <p class="order-success-text">Спасибо за заказ! Мы свяжемся с вами в ближайшее время.</p>
            <button class="success-btn" id="successBtn">
                <i class="fas fa-arrow-left"></i>
                Вернуться в магазин
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
